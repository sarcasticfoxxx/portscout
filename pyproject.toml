[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portscout"
version = "0.1.0"
description = "A small async TCP port scanner with banner grabbing, written in pure Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "port-scanner", "asyncio", "networking", "pentest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
portscout = "portscout.cli:main"

[tool.setuptools.packages.find]
include = ["portscout*"]
